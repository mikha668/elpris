<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elpriser · SE</title>
    <meta name="theme-color" content="#0b1220">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Elpriser SE">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1220;
        color: #e5edf8;
        --page: #0b1220;
        --clock-center-mask-opacity: 0.55;
        --surface: #101a2a;
        --surface-muted: #142033;
        --border: #26364c;
        --text: #e5edf8;
        --muted: #91a4bd;
        --accent: #70d5c0;
        --accent-soft: #17352f;
        --hand: #70d5c0;
        --dial: #52657d;
        --error: #ff9d9d;
        --price-cheap: #66d98a;
        --price-middle: #ffd45c;
        --price-expensive: #ff8585;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 40px 20px;
        background: var(--page);
        color: var(--text);
      }

      main {
        width: min(100%, 900px);
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 22px;
      }

      .eyebrow {
        margin: 0;
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }

      .brand-line {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        flex: 0 0 auto;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 5px 10px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      .header-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      select {
        flex: 0 0 auto;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 5px 10px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-weight: 650;
      }

      button:hover:not(:disabled) {
        border-color: var(--accent);
      }

      button:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      button:disabled,
      select:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .panel {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: 0 18px 48px rgb(20 40 65 / 8%);
      }

      .clock-panel {
        overflow: visible;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .status-separator {
        color: var(--muted);
        font-size: 0.8rem;
      }

      #status {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      #status::before {
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #8292a7;
        content: "";
      }

      #status[data-state="loading"]::before {
        background: #d69c27;
      }

      #status[data-state="success"]::before {
        background: var(--accent);
      }

      #status[data-state="error"] {
        color: var(--error);
      }

      #status[data-state="error"]::before {
        background: var(--error);
      }

      .clock-wrap {
        padding: clamp(4px, 2vw, 14px) clamp(10px, 4vw, 28px);
      }

      #clock {
        display: block;
        width: min(100%, 720px);
        height: auto;
        margin: 0 auto;
        overflow: visible;
      }

      .price-chart-section {
        width: min(100%, 720px);
        margin: 0 auto;
      }

      .price-chart-title {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 600;
      }

      .price-chart-source {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.65rem;
      }

      #price-chart {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .chart-grid-line {
        stroke: var(--border);
        stroke-width: 1;
      }

      .chart-axis-label {
        fill: var(--muted);
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }

      .chart-segment {
        stroke-linecap: round;
        stroke-width: 4;
      }

      .chart-segment.cheap,
      .chart-point.cheap {
        stroke: var(--price-cheap);
        fill: var(--price-cheap);
      }

      .chart-segment.middle,
      .chart-point.middle {
        stroke: var(--price-middle);
        fill: var(--price-middle);
      }

      .chart-segment.expensive,
      .chart-point.expensive {
        stroke: var(--price-expensive);
        fill: var(--price-expensive);
      }

      .chart-segment.passed,
      .chart-point.passed {
        stroke: #929baa;
        fill: #929baa;
      }

      #chart-now {
        stroke: var(--accent);
        stroke-dasharray: 4 5;
        stroke-width: 2;
      }

      .dial-ring,
      .dial-tick {
        fill: none;
        stroke: var(--dial);
      }

      .dial-ring {
        stroke-width: 1.5;
      }

      .dial-tick {
        stroke-width: 1.5;
      }

      .dial-tick.hour-tick {
        stroke-width: 2.5;
      }

      .hour-label {
        fill: var(--text);
        font-size: 32px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .hour-label.passed {
        fill: #78869a;
      }

      .price-label {
        fill: var(--muted);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .price-label.cheap,
      .current-price.cheap {
        fill: var(--price-cheap);
      }

      .price-label.middle,
      .current-price.middle {
        fill: var(--price-middle);
      }

      .price-label.expensive,
      .current-price.expensive {
        fill: var(--price-expensive);
      }

      .price-label.passed {
        fill: #78869a;
      }

      .price-label.current {
        font-weight: 800;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      #hand {
        stroke: var(--hand);
        stroke-linecap: round;
        stroke-width: 4;
      }

      .clock-center-mask {
        fill: var(--page);
        opacity: var(--clock-center-mask-opacity);
      }

      .clock-center {
        fill: var(--text);
        font-size: 34px;
        font-variant-numeric: tabular-nums;
        font-weight: 750;
        text-anchor: middle;
      }

      .center-caption {
        fill: var(--muted);
        font-size: 13px;
        text-anchor: middle;
      }

      .current-price {
        fill: var(--accent);
        font-size: 20px;
        font-variant-numeric: tabular-nums;
        font-weight: 750;
        text-anchor: middle;
      }

      .json-details {
        margin-top: 18px;
      }

      .json-details summary {
        padding: 16px 18px;
        color: var(--muted);
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 650;
      }

      pre {
        max-height: 60vh;
        overflow: auto;
        margin: 0;
        padding: 18px;
        border-top: 1px solid var(--border);
        background: var(--surface-muted);
        color: var(--text);
        font: 0.82rem/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
        tab-size: 2;
      }

      @media (max-width: 560px) {
        body {
          padding: 24px 8px;
        }

        header {
          flex-direction: column;
          gap: 16px;
        }

        .header-controls {
          width: 100%;
        }

        .clock-wrap {
          margin-inline: -4px;
          padding: 0;
        }

        #clock {
          width: 100%;
        }

        .price-chart-title {
          padding-inline: 8px;
          font-size: 0.85rem;
        }

        .chart-axis-label {
          font-size: 17px;
        }

        .chart-segment {
          stroke-width: 5;
        }

        .chart-point {
          r: 4px;
        }

        .hour-label {
          font-size: 25px;
        }

        .price-label {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand-line">
          <p id="eyebrow" class="eyebrow">Elpriser SE3</p>
          <span class="status-separator" aria-hidden="true">-</span>
          <span id="status" data-state="loading" role="status" aria-live="polite">Loading…</span>
        </div>
        <div class="header-controls">
          <label for="area-select" class="visually-hidden">Elområde</label>
          <select id="area-select" aria-label="Elområde">
            <option value="SE1">SE1</option>
            <option value="SE2">SE2</option>
            <option value="SE3">SE3</option>
            <option value="SE4">SE4</option>
          </select>
          <button id="refresh" type="button">Uppdatera data</button>
        </div>
      </header>

      <section class="panel clock-panel" aria-label="24-hour electricity price clock">
        <div class="clock-wrap">
          <svg id="clock" viewBox="0 0 800 800" role="img" aria-labelledby="clock-title clock-description">
            <title id="clock-title">24-hour electricity price clock for SE3</title>
            <desc id="clock-description">Prices are shown for every 15-minute period. The single hand shows Sweden time. Midnight is at the top of the clock. After 14:00, the previous six hours retain today's prices in gray; earlier elapsed hours show tomorrow's prices and are marked +.</desc>
            <circle class="dial-ring" cx="400" cy="400" r="350"></circle>
            <g id="ticks"></g>
            <g id="labels"></g>
            <line id="hand" x1="400" y1="400" x2="400" y2="190"></line>
            <circle class="clock-center-mask" cx="400" cy="400" r="86"></circle>
            <text id="clock-time" class="clock-center" x="400" y="386">--:--</text>
            <text id="timezone-label" class="center-caption" x="400" y="414"></text>
            <text id="current-price" class="current-price" x="400" y="446">-- SEK/kWh</text>
          </svg>
        </div>
      </section>

      <section class="price-chart-section" aria-label="Electricity prices over the day">
        <h2 class="price-chart-title">Elpris senaste och kommande 12 timmar (SEK/kWh)</h2>
        <svg id="price-chart" viewBox="0 0 800 320" role="img" aria-labelledby="price-chart-title price-chart-description">
          <title id="price-chart-title">Electricity price graph for the day</title>
          <desc id="price-chart-description">Each point represents a 15-minute electricity price in a rolling 24-hour window, with 12 hours before and after now. Hours on the following date are marked +.</desc>
          <g id="chart-grid"></g>
          <g id="chart-data"></g>
          <line id="chart-now" x1="68" y1="28" x2="68" y2="330"></line>
          <g id="chart-labels"></g>
        </svg>
        <p class="price-chart-source">Data från elprisetjustnu.se</p>
      </section>

      <details id="api-response" class="panel json-details" hidden>
        <summary>View the original API response as formatted JSON</summary>
        <pre id="response" aria-label="JSON response">Loading data…</pre>
      </details>
    </main>

    <script>
      //Derkert 2026
      const SHOW_API_RESPONSE = false;
      const refreshButton = document.querySelector("#refresh");
      const areaSelect = document.querySelector("#area-select");
      const responseElement = document.querySelector("#response");
      const apiResponseElement = document.querySelector("#api-response");
      const statusElement = document.querySelector("#status");
      const eyebrowElement = document.querySelector("#eyebrow");
      const labelsElement = document.querySelector("#labels");
      const ticksElement = document.querySelector("#ticks");
      const handElement = document.querySelector("#hand");
      const timeElement = document.querySelector("#clock-time");
      const timeZoneLabelElement = document.querySelector("#timezone-label");
      const currentPriceElement = document.querySelector("#current-price");
      const chartGridElement = document.querySelector("#chart-grid");
      const chartDataElement = document.querySelector("#chart-data");
      const chartNowElement = document.querySelector("#chart-now");
      const chartLabelsElement = document.querySelector("#chart-labels");
      const chartPlot = { left: 68, right: 780, top: 22, bottom: 258 };
      const deviceTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      timeZoneLabelElement.textContent = deviceTimeZone;
      const swedishClockFormat = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/Stockholm",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      });
      const swedishDatePartsFormat = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Stockholm",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      });
      const swedishDateFormat = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/Stockholm",
        year: "numeric",
        month: "long",
        day: "numeric"
      });
      const swedishPeriodFormat = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/Stockholm",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      });
      const swedishHourFormat = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/Stockholm",
        hour: "2-digit",
        hourCycle: "h23"
      });
      let quarterHourPrices = [];
      let tomorrowQuarterHourPrices = [];
      let displayQuarterHourPrices = [];
      let timedPrices = new Map();
      let showTomorrowPrices = false;
      let displayedDate = "";
      const areaStorageKey = "elpriser-area";
      const validAreas = ["SE1", "SE2", "SE3", "SE4"];

      try {
        const savedArea = localStorage.getItem(areaStorageKey);
        if (validAreas.includes(savedArea)) {
          areaSelect.value = savedArea;
        }
      } catch (error) {
        console.warn("Could not read the saved electricity price area:", error);
      }

      apiResponseElement.hidden = !SHOW_API_RESPONSE;

      function stockholmDate(now, daysToAdd = 0) {
        const parts = Object.fromEntries(
          swedishDatePartsFormat.formatToParts(now).map(({ type, value }) => [type, value])
        );
        const date = new Date(Date.UTC(
          Number(parts.year),
          Number(parts.month) - 1,
          Number(parts.day) + daysToAdd
        ));
        return date.toISOString().slice(0, 10);
      }

      function apiUrlForDate(date, area) {
        const [year, month, day] = date.split("-");
        return `https://www.elprisetjustnu.se/api/v1/prices/${year}/${month}-${day}_${area}.json`;
      }

      async function fetchPricesForDate(date, area) {
        const apiUrl = apiUrlForDate(date, area);
        console.info(`GET ${apiUrl}`);
        const response = await fetch(apiUrl, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Request failed for ${date}: ${response.status} ${response.statusText}`);
        }

        const prices = await response.json();
        if (!Array.isArray(prices)) {
          throw new Error(`The API response for ${date} was not a JSON array.`);
        }
        return prices;
      }

      function setDisplayedDate(date) {
        const displayDate = new Date(`${date}T12:00:00Z`);
        const formattedDate = swedishDateFormat.format(displayDate);
        eyebrowElement.textContent = `Elpriser ${areaSelect.value} · ${formattedDate}`;
      }

      function renderClock() {
        const now = new Date();
        const timeParts = Object.fromEntries(
          swedishClockFormat.formatToParts(now).map(({ type, value }) => [type, value])
        );
        const hours = Number(timeParts.hour);
        const minutes = Number(timeParts.minute);
        const seconds = Number(timeParts.second);
        const elapsedPeriods = hours * 4 + minutes / 15 + seconds / 900;
        const angle = ((hours + minutes / 60 + seconds / 3600) / 24) * Math.PI * 2 - Math.PI / 2;
        const handRadius = 260;

        handElement.setAttribute("x2", String(400 + Math.cos(angle) * handRadius));
        handElement.setAttribute("y2", String(400 + Math.sin(angle) * handRadius));
        timeElement.textContent = `${timeParts.hour}:${timeParts.minute}`;

        const periodIndex = hours * 4 + Math.floor(minutes / 15);
        const currentHour = hours;
        const quarterProgress = (now.getTime() % 900000) / 900000;
        const nowX = chartPlot.left
          + ((48 + quarterProgress) / 96) * (chartPlot.right - chartPlot.left);
        chartNowElement.setAttribute("x1", String(nowX));
        chartNowElement.setAttribute("x2", String(nowX));

        const price = quarterHourPrices[periodIndex];
        currentPriceElement.classList.remove("cheap", "middle", "expensive");
        if (price !== undefined) {
          currentPriceElement.classList.add(
            priceCategory(price, thresholdsForTimestamp(now.getTime()))
          );
        }
        currentPriceElement.textContent = price === undefined
          ? "-- SEK/kWh"
          : `${price.toFixed(2)} SEK/kWh`;

        for (const label of labelsElement.querySelectorAll(".price-label")) {
          const period = Number(label.dataset.period);
          const periodsBehind = elapsedPeriods - period;
          label.classList.toggle("current", Number(label.dataset.period) === periodIndex);
          label.classList.toggle(
            "passed",
            showTomorrowPrices
              ? period < periodIndex && periodsBehind <= 24
              : period < periodIndex
          );
        }

        const elapsedHours = hours + minutes / 60 + seconds / 3600;
        for (const label of labelsElement.querySelectorAll(".hour-label")) {
          const hour = Number(label.dataset.hour);
          const hoursBehind = elapsedHours - hour;
          label.classList.toggle(
            "passed",
            showTomorrowPrices
              ? hour < currentHour && hoursBehind <= 6
              : hour < currentHour
          );
        }
        const chartPeriod = 48 + (now.getTime() % 900000) / 900000;
        for (const element of chartDataElement.querySelectorAll("[data-period]")) {
          const period = Number(element.dataset.period);
          element.classList.toggle("passed", period < chartPeriod);
        }
      }

      let priceThresholdsByDate = new Map();

      function priceCategory(price, thresholds) {
        if (price <= thresholds.firstThird) {
          return "cheap";
        }
        if (price <= thresholds.secondThird) {
          return "middle";
        }
        return "expensive";
      }

      function priceThresholds(prices) {
        const validPrices = prices.filter((price) => price !== undefined);
        if (validPrices.length === 0) {
          return { firstThird: 0, secondThird: 0 };
        }

        const minimum = Math.min(...validPrices);
        const maximum = Math.max(...validPrices);
        const third = (maximum - minimum) / 3;
        return {
          firstThird: minimum + third,
          secondThird: minimum + third * 2
        };
      }

      function thresholdsForTimestamp(timestamp) {
        return priceThresholdsByDate.get(stockholmDate(new Date(timestamp)))
          ?? { firstThird: 0, secondThird: 0 };
      }

      function renderPriceChart() {
        chartGridElement.replaceChildren();
        chartDataElement.replaceChildren();
        chartLabelsElement.replaceChildren();

        const validPrices = [...timedPrices.values()];
        if (validPrices.length === 0) {
          chartNowElement.setAttribute("y1", String(chartPlot.top));
          chartNowElement.setAttribute("y2", String(chartPlot.bottom));
          return;
        }

        const minimum = Math.min(...validPrices);
        const maximum = Math.max(...validPrices);
        const padding = Math.max((maximum - minimum) * 0.12, 0.02);
        const chartMinimum = minimum - padding;
        const chartMaximum = maximum + padding;
        const xForPeriod = (period) => chartPlot.left
          + (period / 96) * (chartPlot.right - chartPlot.left);
        const yForPrice = (price) => chartPlot.bottom
          - ((price - chartMinimum) / (chartMaximum - chartMinimum))
          * (chartPlot.bottom - chartPlot.top);

        for (let row = 0; row < 3; row += 1) {
          const ratio = row / 2;
          const price = chartMaximum - ratio * (chartMaximum - chartMinimum);
          const y = chartPlot.top + ratio * (chartPlot.bottom - chartPlot.top);
          const gridLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
          gridLine.setAttribute("class", "chart-grid-line");
          gridLine.setAttribute("x1", String(chartPlot.left));
          gridLine.setAttribute("x2", String(chartPlot.right));
          gridLine.setAttribute("y1", String(y));
          gridLine.setAttribute("y2", String(y));
          chartGridElement.append(gridLine);

          const priceLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
          priceLabel.setAttribute("class", "chart-axis-label");
          priceLabel.setAttribute("x", String(chartPlot.left - 10));
          priceLabel.setAttribute("y", String(y));
          priceLabel.setAttribute("text-anchor", "end");
          priceLabel.setAttribute("dominant-baseline", "middle");
          priceLabel.textContent = price.toFixed(2);
          chartLabelsElement.append(priceLabel);
        }

        const now = new Date();
        const nowTimestamp = now.getTime();
        const startTimestamp = Math.floor(nowTimestamp / 900000) * 900000 - 12 * 60 * 60 * 1000;
        const currentDate = stockholmDate(now);

        for (const period of [0, 24, 48, 72, 96]) {
          const timestamp = startTimestamp + period * 900000;
          const date = stockholmDate(new Date(timestamp));
          const parts = Object.fromEntries(
            swedishPeriodFormat.formatToParts(new Date(timestamp))
              .map(({ type, value }) => [type, value])
          );
          const x = xForPeriod(period);
          const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
          label.setAttribute("class", "chart-axis-label");
          label.setAttribute("x", String(x));
          label.setAttribute("y", "294");
          label.setAttribute("text-anchor", period === 0 ? "start" : period === 96 ? "end" : "middle");
          label.textContent = `${parts.hour}${date > currentDate ? "+" : ""}`;
          chartLabelsElement.append(label);
        }

        for (let period = 0; period <= 96; period += 1) {
          const timestamp = startTimestamp + period * 900000;
          const price = timedPrices.get(timestamp);
          if (price === undefined) {
            continue;
          }

          const category = priceCategory(price, thresholdsForTimestamp(timestamp));
          const point = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          point.setAttribute("class", `chart-point ${category}`);
          point.setAttribute("cx", String(xForPeriod(period)));
          point.setAttribute("cy", String(yForPrice(price)));
          point.setAttribute("r", "3");
          point.dataset.period = String(period);
          point.classList.toggle("passed", timestamp < nowTimestamp);
          chartDataElement.append(point);

          const nextPeriod = period + 1;
          const nextTimestamp = startTimestamp + nextPeriod * 900000;
          const nextPrice = nextPeriod <= 96 ? timedPrices.get(nextTimestamp) : undefined;
          if (nextPrice !== undefined) {
            const segment = document.createElementNS("http://www.w3.org/2000/svg", "line");
            segment.setAttribute("class", `chart-segment ${category}`);
            segment.setAttribute("x1", String(xForPeriod(period)));
            segment.setAttribute("y1", String(yForPrice(price)));
            segment.setAttribute("x2", String(xForPeriod(Math.min(nextPeriod, 96))));
            segment.setAttribute("y2", String(yForPrice(nextPrice)));
            segment.dataset.period = String(period);
            segment.classList.toggle("passed", timestamp < nowTimestamp);
            chartDataElement.append(segment);
          }
        }

        const nowX = chartPlot.left
          + ((48 + (nowTimestamp % 900000) / 900000) / 96)
          * (chartPlot.right - chartPlot.left);
        chartNowElement.setAttribute("x1", String(nowX));
        chartNowElement.setAttribute("x2", String(nowX));
        chartNowElement.setAttribute("y1", String(chartPlot.top));
        chartNowElement.setAttribute("y2", String(chartPlot.bottom));
      }

      function parsePrices(prices) {
        const periodPrices = Array(96);
        const byTimestamp = new Map();
        for (const entry of prices) {
          const startTime = new Date(entry.time_start);
          if (!Number.isFinite(startTime.getTime()) || !Number.isFinite(entry.SEK_per_kWh)) {
            continue;
          }

          const timeParts = Object.fromEntries(
            swedishPeriodFormat.formatToParts(startTime).map(({ type, value }) => [type, value])
          );
          const hour = Number(timeParts.hour);
          const minute = Number(timeParts.minute);
          if (hour >= 0 && hour < 24 && minute >= 0 && minute < 60 && minute % 15 === 0) {
            periodPrices[hour * 4 + minute / 15] = entry.SEK_per_kWh;
            byTimestamp.set(startTime.getTime(), entry.SEK_per_kWh);
          }
        }

        return { periodPrices, byTimestamp };
      }

      function renderPrices() {
        const nowParts = Object.fromEntries(
          swedishClockFormat.formatToParts(new Date())
            .map(({ type, value }) => [type, value])
        );
        const nowHour = Number(nowParts.hour);
        const nowMinute = Number(nowParts.minute);
        const nowSecond = Number(nowParts.second);
        const nowPeriod = nowHour * 4 + Math.floor(nowMinute / 15);
        const elapsedPeriods = nowHour * 4 + nowMinute / 15 + nowSecond / 900;
        displayedPeriod = nowPeriod;
        displayQuarterHourPrices = quarterHourPrices.map((price, period) => (
          showTomorrowPrices && period < nowPeriod && elapsedPeriods - period > 24
            ? tomorrowQuarterHourPrices[period]
            : price
        ));
        labelsElement.replaceChildren();
        ticksElement.replaceChildren();

        for (let period = 0; period < 96; period += 1) {
          const angle = (period / 96) * Math.PI * 2 - Math.PI / 2;
          const cos = Math.cos(angle);
          const sin = Math.sin(angle);
          const tick = document.createElementNS("http://www.w3.org/2000/svg", "line");
          tick.setAttribute("class", period % 4 === 0 ? "dial-tick hour-tick" : "dial-tick");
          tick.setAttribute("x1", String(400 + cos * 326));
          tick.setAttribute("y1", String(400 + sin * 326));
          const tickLength = period % 4 === 0 ? 12 : 6;
          tick.setAttribute("x2", String(400 + cos * (326 + tickLength)));
          tick.setAttribute("y2", String(400 + sin * (326 + tickLength)));
          ticksElement.append(tick);

          const priceLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
          priceLabel.setAttribute("class", "price-label");
          priceLabel.setAttribute("x", String(400 + cos * 356));
          priceLabel.setAttribute("y", String(400 + sin * 356));
          priceLabel.dataset.period = String(period);
          const price = displayQuarterHourPrices[period];
          if (price !== undefined) {
            const isTomorrowPrice = showTomorrowPrices
              && period < nowPeriod
              && elapsedPeriods - period > 24;
            const priceDate = isTomorrowPrice
              ? stockholmDate(new Date(), 1)
              : displayedDate;
            priceLabel.classList.add(
              priceCategory(price, priceThresholdsByDate.get(priceDate)
                ?? { firstThird: 0, secondThird: 0 })
            );
          }
          priceLabel.textContent = price === undefined ? "—" : price.toFixed(2);
          labelsElement.append(priceLabel);
        }

        for (let hour = 0; hour < 24; hour += 1) {
          const angle = (hour / 24) * Math.PI * 2 - Math.PI / 2;
          const hourLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
          hourLabel.setAttribute("class", "hour-label");
          hourLabel.setAttribute("x", String(400 + Math.cos(angle) * 282));
          hourLabel.setAttribute("y", String(400 + Math.sin(angle) * 282));
          hourLabel.dataset.hour = String(hour);
          const dateSuffix = showTomorrowPrices
            && hour < nowHour
            && (nowHour + nowMinute / 60 + nowSecond / 3600 - hour) > 6
            ? " +"
            : "";
          hourLabel.textContent = `${String(hour).padStart(2, "0")}${dateSuffix}`;
          labelsElement.append(hourLabel);
        }

        renderPriceChart();
        renderClock();
      }

      async function loadPrices() {
        refreshButton.disabled = true;
        areaSelect.disabled = true;
        statusElement.dataset.state = "loading";
        statusElement.textContent = "Loading…";
        responseElement.textContent = "Loading data…";

        try {
          const now = new Date();
          const hourInSweden = Number(swedishHourFormat.format(now));
          const shouldShowTomorrowPrices = hourInSweden >= 14;
          const shouldLoadHistoryPrices = hourInSweden < 12;
          const date = stockholmDate(now);
          const tomorrowDate = stockholmDate(now, 1);
          const yesterdayDate = stockholmDate(now, -1);
          displayedDate = date;
          showTomorrowPrices = shouldShowTomorrowPrices;
          setDisplayedDate(date);

          const [historyPrices, todayPrices, tomorrowPrices] = await Promise.all([
            shouldLoadHistoryPrices
              ? fetchPricesForDate(yesterdayDate, areaSelect.value)
              : Promise.resolve([]),
            fetchPricesForDate(date, areaSelect.value),
            shouldShowTomorrowPrices
              ? fetchPricesForDate(tomorrowDate, areaSelect.value)
              : Promise.resolve([])
          ]);
          const parsedHistoryPrices = parsePrices(historyPrices);
          const parsedTodayPrices = parsePrices(todayPrices);
          quarterHourPrices = parsedTodayPrices.periodPrices;
          const parsedTomorrowPrices = parsePrices(tomorrowPrices);
          tomorrowQuarterHourPrices = parsedTomorrowPrices.periodPrices;
          priceThresholdsByDate = new Map([
            ...(shouldLoadHistoryPrices
              ? [[yesterdayDate, priceThresholds(parsedHistoryPrices.periodPrices)]]
              : []),
            [date, priceThresholds(parsedTodayPrices.periodPrices)],
            ...(shouldShowTomorrowPrices
              ? [[tomorrowDate, priceThresholds(parsedTomorrowPrices.periodPrices)]]
              : [])
          ]);
          timedPrices = new Map([
            ...parsedHistoryPrices.byTimestamp,
            ...parsedTodayPrices.byTimestamp,
            ...parsedTomorrowPrices.byTimestamp
          ]);

          responseElement.textContent = JSON.stringify({
            ...(shouldLoadHistoryPrices ? { [yesterdayDate]: historyPrices } : {}),
            [date]: todayPrices,
            ...(shouldShowTomorrowPrices ? { [tomorrowDate]: tomorrowPrices } : {})
          }, null, 2);
          renderPrices();
          console.info(
            `Loaded ${todayPrices.length} price readings for ${date}`
            + (shouldShowTomorrowPrices
              ? ` and ${tomorrowPrices.length} for ${tomorrowDate}`
              : "")
          );
          statusElement.dataset.state = "success";
          statusElement.textContent = "Prices loaded";
        } catch (error) {
          console.error("Could not load electricity prices:", error);
          responseElement.textContent = error instanceof Error
            ? error.message
            : "An unexpected error occurred.";
          statusElement.dataset.state = "error";
          statusElement.textContent = "Could not load data";
          quarterHourPrices = [];
          tomorrowQuarterHourPrices = [];
          priceThresholdsByDate = new Map();
          timedPrices = new Map();
          renderPrices();
          currentPriceElement.textContent = "Data unavailable";
        } finally {
          refreshButton.disabled = false;
          areaSelect.disabled = false;
        }
      }

      let displayedPeriod = -1;

      function checkForDateChange() {
        const now = new Date();
        const shouldShowTomorrowPrices = Number(swedishHourFormat.format(now)) >= 14;
        const date = stockholmDate(now);
        if (shouldShowTomorrowPrices !== showTomorrowPrices || date !== displayedDate) {
          loadPrices();
          return;
        }

        const timeParts = Object.fromEntries(
          swedishClockFormat.formatToParts(now).map(({ type, value }) => [type, value])
        );
        const period = Number(timeParts.hour) * 4 + Math.floor(Number(timeParts.minute) / 15);
        if (period !== displayedPeriod) {
          renderPrices();
        }
      }

      refreshButton.addEventListener("click", loadPrices);
      areaSelect.addEventListener("change", () => {
        try {
          localStorage.setItem(areaStorageKey, areaSelect.value);
        } catch (error) {
          console.warn("Could not save the selected electricity price area:", error);
        }
        loadPrices();
      });
      window.setInterval(() => {
        renderClock();
        checkForDateChange();
      }, 1000);
      loadPrices();

      const canRegisterServiceWorker = window.isSecureContext
        && (location.protocol === "https:"
          || location.hostname === "localhost"
          || location.hostname === "127.0.0.1");

      if ("serviceWorker" in navigator && canRegisterServiceWorker) {
        navigator.serviceWorker.register("./service-worker.js")
          .catch((error) => console.error("Could not register the app service worker:", error));
      } else if (location.protocol === "file:") {
        console.info("App installation needs HTTPS or localhost. This page is currently opened as a local file.");
      }
    </script>
  </body>
</html>
